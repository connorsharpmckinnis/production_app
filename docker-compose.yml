services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-production_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_app}
      POSTGRES_DB: ${POSTGRES_DB:-production_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-production_app} -d ${POSTGRES_DB:-production_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-production_app}:${POSTGRES_PASSWORD:-production_app}@db:5432/${POSTGRES_DB:-production_app}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-32chars}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ORG_NAME: ${ORG_NAME:-Default Organization}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
